name: Market Alarm

on:
  schedule:
    - cron: "7,22,37,52 * * * 1-5"   # every 15 min, Mon-Fri (UTC)
    - cron: "17 */2 * * 0,6"         # every 2 hours at weekends
  workflow_dispatch:
    inputs:
      test_email:
        description: "Send a test e-mail"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: market-alarm
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run market check
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
          DASHBOARD_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          if [ "${{ inputs.test_email }}" = "true" ]; then
            python -m alarm --test-email
          else
            python -m alarm
          fi

      - name: Save state
        run: |
          git config user.name "market-alarm-bot"
          git config user.email "market-alarm-bot@users.noreply.github.com"
          [ -f data/state.json ] && git add data/state.json
          if git diff --cached --quiet; then
            echo "state unchanged"
          else
            git commit -m "Update market state"
            git pull --rebase -X theirs || true
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
